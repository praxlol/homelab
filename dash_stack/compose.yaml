name: dash_stack

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.praxplace.com
    volumes:
      - ./config:/app/config
      - /mnt/media_hdd1_node:/mnt/media:ro
      - ${HDD_MNT:?set HDD_MNT in .env}:/mnt/usb:ro
    networks:
      - starr
      - qbit

networks:
  starr:
    external: true
  qbit:
    external: true
