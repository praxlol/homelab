---
title: Homelab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot

background:
  image: https://w.wallhaven.cc/full/je/wallhaven-jelq8p.jpg
  blur: sm # sm, "", md, xl... see https://tailwindcss.com/docs/backdrop-blur
  saturate: 100 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
  brightness: 50 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
  opacity: 50 # 0-100

layout:
  Homelab:
    style: row
    columns: 4
    useEqualHeights: true
  Media:
    style: row
    columns: 2
    Apps:
      style: row
      columns: 2
      useEqualHeights: true
      header: false
    Calender:
      style: row
      columns: 1
      header: false
  Download:
    style: row
    columns: 3
  Monitoring:
    style: row
    columns: 2
  Backups:
    style: row
    columns: 2
